spring:
  application:
    name: realtime-notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  api-key: ${API_KEY:local-dev-key-change-me}
  rate-limit:
    max-per-window: ${RATE_LIMIT_MAX_PER_WINDOW:5}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  rabbit:
    exchange: notifications.exchange
    routing-key: notifications.send
